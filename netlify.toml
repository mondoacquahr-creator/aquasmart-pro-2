  remote_images = ['https://shop\.ivero\.hr/wp-content/uploads/.*', 'https://asset\.productmarketingcloud\.com/api/assetstorage/.*', 'https://www\.vagnerpool\.hr/static/.*', 'https://d2xfa3et54gu2o\.cloudfront\.net/webshop\.aquachem\.hr/uploads/.*']

