[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# --- Glavna stranica Mondo Acqua (dok je na /mondo-web/) ---
[[redirects]]
  from = "/mondo-web/*"
  to = "/mondo-web/index.html"
  status = 200

# --- Nakon što se www.mondo-acqua.hr usmjeri na ovaj Netlify projekt (do tada se ne aktivira) ---
[[redirects]]
  from = "https://mondo-acqua.hr/*"
  to = "https://www.mondo-acqua.hr/:splat"
  status = 301
  force = true
