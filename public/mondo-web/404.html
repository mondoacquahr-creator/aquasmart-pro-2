<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stranica nije pronađena – Mondo Acqua</title>
<link rel="icon" href="/logo.png">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 80% 0%,#08303D 0%,#041820 55%,#020D12 100%) fixed;color:rgba(255,255,255,.78);font:16px/1.65 Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px max(16px,4vw);border-bottom:1px solid rgba(120,220,255,.12);background:rgba(4,24,32,.75)}
  header a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:700 15px/1 Montserrat,Inter,sans-serif;letter-spacing:.06em}
  header img{width:34px;height:auto}
  header b{color:#4FC3F0;font-weight:700}
  main{flex:1;display:flex;align-items:center;padding:clamp(40px,8vw,90px) max(16px,4vw)}
  .box{max-width:640px}
  .eyebrow{font:700 .74rem/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#5CE1E6;margin:0 0 16px}
  h1{margin:0 0 14px;color:#fff;font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.1;letter-spacing:-.03em}
  p{margin:0 0 26px;font-size:1.08rem;color:rgba(255,255,255,.6)}
  .btns{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;padding:13px 22px;border-radius:999px;font-weight:700;text-decoration:none}
  .p{background:#4FC3F0;color:#0a0a0a}.g{border:1.5px solid rgba(255,255,255,.25);color:#fff}
</style>
</head>
<body>
<header><a href="/"><img src="/logo.png" alt=""><span>MONDO <b>ACQUA</b></span></a></header>
<main><div class="box">
  <p class="eyebrow">Greška 404</p>
  <h1>Stranica nije pronađena.</h1>
  <p>Adresa ne postoji ili je stranica premještena. Pogledajte bazene ili se vratite na početnu.</p>
  <div class="btns"><a class="btn p" href="/bazeni">Bazeni →</a><a class="btn g" href="/">Početna</a></div>
</div></main>
</body>
</html>
