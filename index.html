
  <!DOCTYPE html>

      <meta charset="UTF-8" />
      <!-- Google measurement: loaded only after the visitor opts in. -->
      <script>
        (function () {
          var KEY = 'poolcare_measurement_v1';
          var AGE = 180 * 24 * 60 * 60 * 1000;
          var loaded = false;
          var allowed = false;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('consent', 'default', {
            analytics_storage: 'denied', ad_storage: 'denied',
            ad_user_data: 'denied', ad_personalization: 'denied'
          });
          function readChoice() {
            try {
              var value = JSON.parse(localStorage.getItem(KEY));
              return value && value.version === 1 && typeof value.allowed === 'boolean' &&
                value.at <= Date.now() && Date.now() - value.at < AGE ? value : null;
            } catch (_) { return null; }
          }
          function apply(value) {
            allowed = value === true;
            window.gtag('consent', 'update', {
              analytics_storage: allowed ? 'granted' : 'denied',
              ad_storage: allowed ? 'granted' : 'denied',
              ad_user_data: 'denied', ad_personalization: 'denied'
            });
            if (allowed && !loaded) {
              loaded = true;
              window.gtag('js', new Date());
              var tag = document.createElement('script');
              tag.async = true;
              tag.id = 'poolcare-google-tag';
              tag.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5V4SG6WC';
              document.head.appendChild(tag);
            }
          }
          var saved = readChoice();
          if (saved) apply(saved.allowed);
          document.addEventListener('DOMContentLoaded', function () {
            var panel = document.getElementById('measurement-choice');
            var settings = document.getElementById('measurement-settings');
            var status = document.getElementById('measurement-status');
            function refresh() {
              status.textContent = readChoice() ? (allowed ? 'Trenutno: prihvaćeno.' : 'Trenutno: odbijeno.') : '';
            }
            function choose(value) {
              apply(value);
              try { localStorage.setItem(KEY, JSON.stringify({ version: 1, allowed: value, at: Date.now() })); } catch (_) {}
              // Stop writing Google measurement cookies after withdrawal.
              if (!value) {
                document.cookie.split(';').forEach(function (item) {
                  var name = item.split('=')[0].trim();
                  if (!/^(_ga($|_)|_gid$|_gat($|_)|_gcl_)/.test(name)) return;
                  var domains = ['', location.hostname, '.' + location.hostname];
                  domains.forEach(function (domain) {
                    document.cookie = name + '=; Max-Age=0; path=/' + (domain ? '; domain=' + domain : '') + '; SameSite=Lax; Secure';
                  });
                });
              }
              refresh(); panel.hidden = true; settings.hidden = false;
              settings.setAttribute('aria-expanded', 'false'); settings.focus();
            }
            document.getElementById('measurement-allow').onclick = function () { choose(true); };
            document.getElementById('measurement-deny').onclick = function () { choose(false); };
            document.getElementById('measurement-close').onclick = function () {
              panel.hidden = true; settings.hidden = false;
              settings.setAttribute('aria-expanded', 'false'); settings.focus();
            };
            settings.onclick = function () {
              panel.hidden = false; settings.hidden = true;
              document.getElementById('measurement-close').hidden = !readChoice();
              settings.setAttribute('aria-expanded', 'true');
              document.getElementById('measurement-deny').focus();
            };
            panel.hidden = !!saved; settings.hidden = !saved;
            refresh();
          });
        })();
      </script>

      </style>
