<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AquaSmart Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0891B2 0%, #06B6D4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      padding: 48px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #0891B2 0%, #06B6D4 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    
    h1 {
      font-size: 24px;
      color: #1F2937;
      margin-bottom: 12px;
    }
    
    p {
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .button {
      display: inline-block;
      background: linear-gradient(135deg, #0891B2 0%, #06B6D4 100%);
      color: white;
      padding: 12px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(8, 145, 178, 0.3);
    }
    
    .features {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid #E5E7EB;
    }
    
    .feature {
      margin-bottom: 16px;
      color: #6B7280;
      font-size: 14px;
    }
    
    .feature strong {
      color: #1F2937;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💧</div>
    <h1>Niste online</h1>
    <p>AquaSmart Pro zahtijeva internetsku vezu za potpunu funkcionalnost. Molimo provjerite vašu vezu i pokušajte ponovno.</p>
    <a href="/" class="button" onclick="window.location.reload(); return false;">Pokušaj ponovno</a>
    
    <div class="features">
      <div class="feature">
        <strong>💡 Savjet:</strong> Vaši spremljeni bazeni i analize su dostupni čim se povežete.
      </div>
      <div class="feature">
        Aplikacija automatski sinkronizira podatke kada se vratite online.
      </div>
    </div>
  </div>
</body>
</html>
